# Installs, tests and builds the two Node packages in this repo across Node versions:
# frontend/ (the CRA app, yarn) and site/ (the dashboard, npm). There is no package.json at the repo root.
# Also runs the workflow layout check in tests/workflows.test.mjs.

name: Node.js CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:

    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [20.x, 22.x] # react-router 7 needs Node 20+
        # See supported Node.js release schedule at https://nodejs.org/en/about/releases/

    steps:
    - uses: actions/checkout@v4
    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
    - run: node --test tests/workflows.test.mjs
    - run: yarn install --frozen-lockfile
      working-directory: frontend
    - run: yarn test --watchAll=false
      working-directory: frontend
      env:
        CI: true
    - run: yarn build
      working-directory: frontend
      env:
        CI: true
    - run: npm ci
      working-directory: site
    - run: npm test
      working-directory: site
    - run: npm run build
      working-directory: site
